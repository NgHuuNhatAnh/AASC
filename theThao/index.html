<style>
  :root{
    --text1:white;
    --text3:black;
   --fontSize4:clamp(.95rem, 1vw, 1.1rem);
   --fontSize3:clamp(1.1rem, 1vw, 1.3rem);
   --fontSize2:clamp(1.3rem, 1vw, 2rem);
    --font-serif: 'Noto Serif', serif;
    --scroll-bar:#e7bc6d46;
  --navy:#8F3F0A;
--teal:#D65F0A;

  --navy-deep:linear-gradient(
            135deg,
            #ffffff 0%,
            #ffffff 60%,
            #fff7ed 78%,
            #ffd6a3 100%
        );;

  
  --teal-soft:#A84E13;

  --chalk:black;

  --chalk-dim:rgba(255,243,226,.62);

  --yellow:#FFCC66;

  --coral:#FF7A3D;

  --line:black;

  --line-strong:black;

  --topbar-h: 100px;

  --mono:'Space Mono',ui-monospace,monospace;

  --sans:'Be Vietnam Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--navy-deep);
    color:var(--chalk);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  input{font-family:inherit;}
  ::selection{background:var(--yellow);color:var(--navy-deep);}
 

/* cái app shell  */
.app-shell{
  /* opacity: 0; */
}

/*----- cái hình background ----------- */
  .image-background{
    position:absolute; 
    top: 200px;
    right:5px;
    width:300px; 
    height:300px; 
    object-fit:cover; 
    object-position:center;
    z-index:0;
      /* flex-shrink: 0; */

  }
  /* ---------- Court-line texture ---------- */
  .court-bg{
    background-image:
      linear-gradient(180deg,var(--teal) 0%,var(--navy) 62%);
    position:relative;
  }
  .court-bg::after{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(243,246,236,.05) 0 1px, transparent 1px 64px);
    pointer-events:none;
  }

  /* ---------- Topbar ---------- */
 .topbar {
    min-height: var(--topbar-h);
    height: auto;

    display: flex;
    align-items: center;
    flex-wrap: wrap;

    gap: 10px;
    padding: 10px clamp(10px, 3vw, 24px);

    background: var(--navy);
    border-bottom: 1px solid var(--line);

    position: relative;
    z-index: 0;
}
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;

    flex: 0 0 auto;
    white-space: nowrap;
}

.tabs {
    flex: 1 1 auto;

    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    overflow: visible;
}

.tab {
    flex: 0 0 auto;       /* KHÔNG cho tab co lại */

    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: white;

    padding: 16px 20px;
    border-radius: 999px;

    font-weight: 600;
    font-size: var(--fontSize4);

    white-space: nowrap;
    cursor: pointer;

    font-family: var(--sans);
}
 
  .brand-text{font-weight:800; 
    font-size:var(--fontSize3); 
    letter-spacing:.01em;color: white;}

  .brand-text small{display:block; font-weight:500; font-size:var(--fontSize4); color:var(--chalk-dim); font-family:var(--mono);}

  
  .tabs::-webkit-scrollbar{display:none;}
  
 
  .tab:hover{border-color:var(--line-strong);}
  .tab:active{transform:scale(.97);}
  .tab.active{
    background:var(--yellow); color:black; border-color:var(--yellow);}


  /* ---------- Slide track ---------- */
  .viewport{
    height:calc(100dvh - var(--topbar-h));
    overflow-x: hidden;
    overflow-y: auto;
    position:relative;
    z-index: 0;
  }
  .track{
    display:flex; 
    height:auto;

  min-height: 100%;
}
  .panel{
    flex:0 0 100vw; 
    width:100vw; 
    height:auto;
     overflow-y: auto;
     overflow-x: hidden ;
  }
  
  .tournament-block{
    /* min-height: 50vw; */
    overflow-x: auto; 
    /* overflow-y: auto; */
     scrollbar-width: none;
  }

  .tournament-block::-webkit-scrollbar {
    display: none; /* Chrome / Edge */
}

  /* ---------- Hero ---------- */
  .hero{
    padding:10px clamp(22px,4vw,32px);
    border-bottom:4px solid var(--yellow);
    display:flex; justify-content:flex-start; 
    align-items:center; gap:20px; flex-wrap:wrap;
  }

  .court-bg >div {
    z-index: 5;
  }

 /* .court-bg > .hero-icon {
    z-index: 3;
} */

  .hero-title{
    font-size:clamp(2.1rem,7vw,3.6rem); font-weight:800; margin:0; line-height:1.02;
  color:var(--text1)}
  .hero-sub{margin:10px 0 0; font-family:var(--mono); font-size:.82rem; color:var(--chalk-dim); letter-spacing:.01em;}
  .hero-icon {
    width: min(250px, 20vw);
    height: min(250px, 20vw);
    flex-shrink: 0;
    opacity: 1;
}

  /* ---------- Sections ---------- */
  section.block{
    padding:clamp(18px,4vw,44px) clamp(18px,6vw,64px);
    z-index:10; position:relative;
    }
  section.block + section.block{border-top:1px solid var(--line);}
  .block h2{
    font-size:var(--fontSize2); 
    font-weight:700;
     margin:0 0 16px;}

  .rules-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; max-width:760px;}
  .rules-list li{
    display:flex; 
    gap:12px; 
    align-items:flex-start; 
    font-size: var(--fontSize3); 
    line-height:1.5;}
  .rules-list li .dot{width:9px;height:9px;background:var(--yellow); border-radius:2px; margin-top:7px; flex-shrink:0;}
  .rules-note{margin-top:14px; padding:10px 14px; border-left:3px solid var(--coral); font-size:.86rem; color:var(--chalk-dim); font-style:italic; max-width:760px;}


  /* đoạn participants */

  .participants-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:10px;
     align-items: start;
  }
.p-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: var(--fontSize4);

  min-height: clamp(45px, 4vw, 70px);
  height: auto;
  box-sizing: border-box;
}


  .groups-grid{
    display:grid; 
     grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap:16px;
    align-items: start;
  }
  .group-card{
    border:1px solid var(--line); border-radius:14px; overflow:hidden; background:rgba(243,246,236,.03);
  }

  .group-head{
    color: var(--text1);
    background:var(--teal-soft); 
    padding:10px 14px; 
    font-family:var(--mono);
     font-weight:700;
    font-size:var(--fontSize3); 
    letter-spacing:.02em;
     display: flex;
    align-items: center; 
    justify-content: center;
  }

  .slot-group{
    width:100%; background:transparent; border-top:1px solid var(--line-strong);
    padding: 15px 14px;
    color:var(--chalk); 
    font-size:var(--fontSize4);
     outline:none;
      height: clamp(45px, 4vw, 70px);
    box-sizing: border-box;
     display: flex;
    align-items: center; 
  }
  
  /* bảng bóng đá */

  
  .group-schedule-wrap{
    overflow-x:auto;
      scrollbar-width: none; /* Firefox */
  }
   .group-schedule-wrap::-webkit-scrollbar {
    display: none; /* Chrome / Edge */
}

  .group-schedule{
    width:100%; min-width:900px; border-collapse:collapse;
    background:rgba(243,246,236,.06); font-size:.88rem;
  }
  .group-schedule th,
  .group-schedule td{
    border:1px solid var(--line); padding:8px 10px; text-align:center;
    font-size: var(--fontSize4);
  }
  .group-schedule thead th{background:var(--yellow); color:var(--text3); font-weight:700;}
  .group-schedule td:first-child,
  .group-schedule td:nth-child(2){white-space:nowrap; font-family:var(--mono); font-size:.78rem;}
  .schedule-team{min-width:92px; font-weight:600;}
  .schedule-court,

  .schedule-court input,
  .schedule-score input{
    width:100%; min-width:0; padding:5px 4px; text-align:center;
    border:1px dashed var(--line-strong); border-radius:4px;
    background:transparent; color:var(--chalk); font: .78rem var(--mono);
  }
.schedule-score-pair {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

/* style của cái cửa mở  */
 /* Container chính */
        .scene {
            position: absolute;
            top:0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

      /* .revealed {
            opacity: 1;
            transform: scale(1);
        } */

        /* Các cánh cửa trượt ngang */
        .door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            pointer-events: auto; /* Chặn click xuyên qua cửa khi đang đóng */
        }

        .door-left {
            /* Clip path zig-zag cho nửa bên trái */
            clip-path: polygon(
                0% 0%, 50% 0%, 
                calc(50% - 40px) 10%, calc(50% + 40px) 20%, 
                calc(50% - 40px) 30%, calc(50% + 40px) 40%, 
                calc(50% - 40px) 50%, calc(50% + 40px) 60%, 
                calc(50% - 40px) 70%, calc(50% + 40px) 80%, 
                calc(50% - 40px) 90%, 50% 100%, 
                0% 100%
            );
            background: linear-gradient(135deg, #f7931e 0%, #c1272d 100%);
            /* Thêm bóng để tách biệt hai cánh cửa khi xếp chồng lên nhau */
            filter: drop-shadow(5px 0 15px rgba(0,0,0,0.7));
            z-index: 11; /* Đặt cao hơn cửa phải 1 chút để bóng đè lên */
        }

        .door-right {
            /* Clip path zig-zag khớp vừa khít cho nửa bên phải */
            clip-path: polygon(
                100% 0%, 50% 0%, 
                calc(50% - 40px) 10%, calc(50% + 40px) 20%, 
                calc(50% - 40px) 30%, calc(50% + 40px) 40%, 
                calc(50% - 40px) 50%, calc(50% + 40px) 60%, 
                calc(50% - 40px) 70%, calc(50% + 40px) 80%, 
                calc(50% - 40px) 90%, 50% 100%, 
                100% 100%
            );
            background: linear-gradient(135deg, #f7931e 0%, #9e1f24 100%);
            z-index: 10;
        }

        /* Trạng thái mở cửa */
        .door-left.open {
            transform: translateX(-100vw);
        }

        .door-right.open {
            transform: translateX(100vw);
        }

        /* Lớp giao diện chứa nút bấm ban đầu */
        .ui-layer {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .ui-layer.hidden-ui {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        /* Hiệu ứng trôi nổi */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Hiệu ứng nền thay đổi linh hoạt */
        .bg-football {
            background: radial-gradient(circle at center, #dcfce7 0%, #22c55e 100%);
        }
        
        .bg-pickleball {
            background: radial-gradient(circle at center, #fce7f3 0%, #db2777 100%);
        }

function createGroupScheduleTable(schedule){
  const renderMatch = (match, groupName, rowIndex) => {
    if (!match) return '<td></td><td></td><td></td><td></td>';

    return `<td class="schedule-court">${esc(match.court)}</td>
      <td class="schedule-team">${esc(match.teams[0])}</td>
      <td class="schedule-team">${esc(match.teams[1])}</td>
      <td class="schedule-score"><div class="schedule-score-pair">
       ${match.score==null?' - ': match.score }
      </div></td>`;
  };


  const rows = schedule.map((round, index) => `<tr>
    <td>${esc(round.date)}</td>
    <td>${esc(round.time)}</td>
    ${renderMatch(round.a, 'A', index)}
    ${renderMatch(round.b, 'B', index)}
  </tr>`).join('');

  return `<table class="group-schedule">
    <thead>
      <tr>
        <th rowspan="2">Ngày</th>
        <th rowspan="2">Giờ</th>
        <th colspan="4">Bảng A</th>
        <th colspan="4">Bảng B</th>
      </tr>
      <tr>
        <th>Sân</th><th>Đội</th><th>Đội</th><th>Tỉ số</th>
        <th>Sân</th><th>Đội</th><th>Đội</th><th>Tỉ số</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function createTournamentBracket(arrayParticipants) {

    
    let heigtOfContainer = 0;
    let widthOfContainer = 0;
    let numberOfMatches = 4;
     numberOfMatches = arrayParticipants.matches[0].participants.length/2;

    //  console.log('number of matches: ',numberOfMatches)
    let participants = arrayParticipants.matches[0].participants;
    let stt = 0;

    const gapRows = 15;
    const gapColumns = 70;
    const connectorConnerRadius = 10;
    const boxTeamHeight = 80;   
    const boxTeamWidth = 220;  

    const roundTitleHeight = 40;
    const marginBotRoundTitle = 20;
    // const bracket = document.getElementById('tourament-bracket');

    // Kiểm tra số đội có phải lũy thừa của 2
    if (
        numberOfMatches <= 0 ||
        Math.log2(numberOfMatches) % 1 !== 0
    ) {
        throw new Error(
            'Số đội phải là lũy thừa của 2'
        );
    }
    // Xóa bracket cũ nếu có
    let bracketHTML = '';

    // Tổng số round
    const totalRounds = Math.log2(numberOfMatches)+1;

    // Khoảng cách hiện tại giữa các box
    let currentGapRows = gapRows;
  
    // Số box của round hiện tại
    let currentNumberOfMatches = numberOfMatches;
    let translateYvalue= 0;
    let currentRoundTop=roundTitleHeight + marginBotRoundTitle;;
    let oldgapRows=0;


    // Vòng lặp từng round (nhưng để tạo match, k cần tạo round)
    for (
        let roundIndex = 0;
        roundIndex < totalRounds;
        roundIndex++
    ) {

        for (
            let matchIndex = 0;
            matchIndex < currentNumberOfMatches;
            matchIndex++
        ) {

           const matchLeft = (boxTeamWidth + gapColumns) * roundIndex;

          if (matchIndex ==0) {
              bracketHTML += `<div class="round-title"
              style="
              position: absolute;
              height: ${roundTitleHeight}px;
              width:${boxTeamWidth}px;
             transform: translateX(${matchLeft}px);
              margin-bottom:${marginBotRoundTitle}px;">
              ${arrayParticipants.matches[roundIndex].name}
              </div>`;
              
          }

           

            // match.style.transform = `translate(${matchLeft}px,${translateYvalue}px)`;

            bracketHTML += `<div class="bracket-match" style="
            position : absolute;
            top: ${currentRoundTop}px;
            height: ${boxTeamHeight}px;
            width : ${boxTeamWidth}px;
            transform: translate(${matchLeft}px,${translateYvalue}px)">
            <div class="team-row">
              <span>${participants[stt]?.[0] ?? '-'}</span><span>${participants[stt]?.[1] ?? '-'}</span>
            </div>
            <div class="team-row">
              <span>${participants[stt+1]?.[0] ?? '-'}</span><span>${participants[stt+1]?.[1] ?? '-'}</span>
            </div>
            </div>`;

            stt += 2;

            if (roundIndex!= 0){

            // const rect = match.getBoundingClientRect();

            // const currentMatchLeft = rect.left;
            const middlteOfMatch = currentRoundTop + translateYvalue + boxTeamHeight/2;

            bracketHTML += `<div class="connector-1" style="
            position : absolute;
            top: ${middlteOfMatch}px;
            left: ${(matchLeft - gapColumns)}px;
            height: ${(oldgapRows+ boxTeamHeight)/2}px;
            width : ${gapColumns/2}px;
            border-top-right-radius: ${connectorConnerRadius}px;
            transform: translateY(-100%)"></div>

            <div class="connector-2" style="
            position : absolute;
            top: ${middlteOfMatch}px;
            left: ${(matchLeft  - gapColumns)}px;
            height: ${(oldgapRows+ boxTeamHeight)/2}px;
            width : ${gapColumns/2}px;
            border-bottom-right-radius: ${connectorConnerRadius}px;">
            </div>

            <div class="connector-line" style="
            position : absolute;
            top: ${middlteOfMatch}px;
            left: ${matchLeft - gapColumns/2}px;
            height: 0px;
            width : ${gapColumns/2}px;"></div>`

            }

            if (matchIndex < currentNumberOfMatches - 1) {
                translateYvalue = (currentGapRows + boxTeamHeight) * (matchIndex + 1);
                // console.log(translateYvalue)
            } else {

                 if (roundIndex == 0) {
                  heigtOfContainer = currentRoundTop + translateYvalue + boxTeamHeight;
                } 

                 if (roundIndex == totalRounds-1) {
                   widthOfContainer = matchLeft + boxTeamWidth*2 + gapColumns ;

                   bracketHTML += 
                   `<div class="champ-container" style="
                   position: absolute;
                    top: ${currentRoundTop}px;
                    height: ${boxTeamHeight}px;
                    width : ${boxTeamWidth}px;
                    transform: translate(${matchLeft+gapColumns+boxTeamWidth}px,${translateYvalue}px)"><div class="champ-card">🏆 <span>Vô địch</span>
                    </div></div>`;
                  
                } 
               

                oldgapRows = currentGapRows;
                currentRoundTop += currentGapRows / 2 + boxTeamHeight / 2;
                translateYvalue = 0;
                currentGapRows = currentGapRows * 2 + boxTeamHeight;
               
            }

            

        }

         
        // Round tiếp theo giảm một nửa số match
        currentNumberOfMatches /= 2;
    }
return [bracketHTML, heigtOfContainer, widthOfContainer];

}

              // console.log(draggable.x)
            }

        })[0];
        
       

        // =========================
        // UPDATE SCROLL
        // =========================

        function updateScroll(drag) {

            const barWidth =
                bar.getBoundingClientRect().width;

            const iconWidth =
                dragIcon.getBoundingClientRect().width;

            const maxDragX =
                barWidth - iconWidth;

            const progress =
                drag.x / maxDragX
            
                

            const maxScrollX =
                target.scrollWidth - target.clientWidth;

            target.scrollLeft =
                progress * maxScrollX;

           
        }

        // khi scroll trên điện thoại
        target.addEventListener("scroll", () => {

            const maxScrollX =
                target.scrollWidth - target.clientWidth;

            if (maxScrollX <= 0) return;

            progress =
                target.scrollLeft / maxScrollX;

            const maxDragX =
                bar.getBoundingClientRect().width -
                dragIcon.getBoundingClientRect().width;

            gsap.set(dragIcon, {
                x: progress * maxDragX
            });

        });

        // =========================
        // RESIZE
        // =========================

      const resizeObserver = new ResizeObserver(() => {

          
          const maxDragX =
              bar.getBoundingClientRect().width - dragIcon.getBoundingClientRect().width;

            const progress =
                draggable.x / maxDragX


          draggable.applyBounds();

          
          

          // // Dùng progress đã lưu
          // gsap.set(dragIcon, {
          //     x: progress * maxDragX
          // });

          // Cập nhật lại scroll theo kích thước mới
          const maxScrollX =
              target.scrollWidth - target.clientWidth;

            //   console.log({
            //     progress: progress,
            //     barClientWidth: bar.clientWidth,
            //     barWidth: bar.getBoundingClientRect().width,
            //     iconOffsetWidth: dragIcon.offsetWidth,
            //     iconWidth: dragIcon.getBoundingClientRect().width,
            //     maxDragX,
            //     progress,
            //     targetScrollLeft: target.scrollLeft,
            //     targetScrollWidth: target.scrollWidth,
            //     targetClientWidth: target.clientWidth,
            //     maxScrollX,
            //     targetId
            // });
          target.scrollLeft =
              progress * maxScrollX;

      });



        resizeObserver.observe(bar);

    });

});
                  

        

    </script>
