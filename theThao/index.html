<style>
  :root{
    --text1:white;
    --text3:black;
   --fontSize4:clamp(.95rem, 1vw, 1.1rem);
   --fontSize3:clamp(1.1rem, 1vw, 1.3rem);
   --fontSize2:clamp(1.3rem, 1vw, 2rem);
    --font-serif: 'Noto Serif', serif;
    --scroll-bar:#e7bc6d46;
  --navy:#8F3F0A;
--teal:#D65F0A;

  --navy-deep:linear-gradient(
            135deg,
            #ffffff 0%,
            #ffffff 60%,
            #fff7ed 78%,
            #ffd6a3 100%
        );;

  
  --teal-soft:#A84E13;

  --chalk:black;

  --chalk-dim:rgba(255,243,226,.62);

  --yellow:#FFCC66;

  --coral:#FF7A3D;

  --line:black;

  --line-strong:black;

  --topbar-h: 100px;

  --mono:'Space Mono',ui-monospace,monospace;

  --sans:'Be Vietnam Pro',system-ui,sans-serif;

  --noResult: red;
  --win: rgb(255, 166, 1);
  --lose: rgba(44, 44, 44, 0.212);

  --soleColor1:rgba(255, 224, 181, .30);
  --soleColor2: rgba(255, 255, 255, .65);
  --theadBorder: 1px solid #B85A16;
  --tbodyBorder: 1px solid #D8A15D;

  --tableBorderRadius:10px;
  --winGroupStage: #1df800a2;

  --championText:red ;
  }


  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--navy-deep);
    color:var(--chalk);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;

    
  }
  input{font-family:inherit;}
  ::selection{background:var(--yellow);color:var(--navy-deep);}
 

/* cái app shell  */
.app-shell{
  /* opacity: 0; */
}

/*----- cái hình background ----------- */
  .image-background{
    position:absolute; 
    top: 200px;
    right:5px;
    width:300px; 
    height:300px; 
    object-fit:cover; 
    object-position:center;
    z-index:0;
      /* flex-shrink: 0; */

  }
  /* ---------- Court-line texture ---------- */
  .court-bg{
    background-image:
      linear-gradient(180deg,var(--teal) 0%,var(--navy) 62%);
    position:relative;
  }
  .court-bg::after{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(243,246,236,.05) 0 1px, transparent 1px 64px);
    pointer-events:none;
  }

  /* ---------- Topbar ---------- */
 .topbar {
    min-height: var(--topbar-h);
    height: auto;
    
    display: flex;
    align-items: center;
    flex-wrap: wrap;

    gap: 10px;
    padding: 10px clamp(10px, 3vw, 24px);

    background: var(--navy);
    border-bottom: 1px solid var(--line);

    position: relative;
    z-index: 0;
}
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;

    flex: 0 0 auto;
    white-space: nowrap;
}

.tabs {
    flex: 1 1 auto;

    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    overflow: visible;
}

.tab {
    flex: 0 0 auto;       /* KHÔNG cho tab co lại */

    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: white;

    padding: 16px 20px;
    border-radius: 999px;

    font-weight: 600;
    font-size: var(--fontSize4);

    white-space: nowrap;
    cursor: pointer;

    font-family: var(--sans);
}
 
  .brand-text{font-weight:800; 
    font-size:var(--fontSize3); 
    letter-spacing:.01em;color: white;}

  .brand-text small{display:block; font-weight:500; font-size:var(--fontSize4); color:var(--chalk-dim); font-family:var(--mono);}

  
  .tabs::-webkit-scrollbar{display:none;}
  
 
  .tab:hover{border-color:var(--line-strong);}
  .tab:active{transform:scale(.97);}
  .tab.active{
    background:var(--yellow); color:black; border-color:var(--yellow);}


  /* ---------- Slide track ---------- */
  .viewport{
    height:calc(100dvh - var(--topbar-h));
    overflow-x: hidden;
    overflow-y: auto;
    position:relative;
    z-index: 0;
     scrollbar-width: none;
  }

  .viewport::-webkit-scrollbar {
    display: none; /* Chrome / Edge */
}


  .track{
    display:flex; 
    height:auto;
    align-items: flex-start;
    min-height: 100%;
   
}



  .panel{
    flex:0 0 100vw; 
    width:100vw; 
    height:auto;
     overflow-y: auto;
     overflow-x: hidden ;
     position: relative;
  }
  
  @media (max-width: 700px) {
    .panel.pickleball:nth-of-type(3) {
      height: 3900px;
    }
  }
  



 

.group-schedule-wrap{
  width: fit-content;
}

  /* ---------- Hero ---------- */
  .hero{
    padding:10px clamp(22px,4vw,32px);
    border-bottom:4px solid var(--yellow);
    display:flex; justify-content:flex-start; 
    align-items:center; gap:20px; flex-wrap:wrap;
  }

  .court-bg >div {
    z-index: 5;
  }

 /* .court-bg > .hero-icon {
    z-index: 3;
} */

  .hero-title{
    font-size:clamp(2.1rem,7vw,3.6rem); font-weight:800; margin:0; line-height:1.02;
  color:var(--text1)}
  .hero-sub{margin:10px 0 0; font-family:var(--mono); font-size:.82rem; color:var(--chalk-dim); letter-spacing:.01em;}
  .hero-icon {
    width: min(250px, 20vw);
    height: min(250px, 20vw);
    flex-shrink: 0;
    opacity: 1;
}


/* Ngày thi đấu  */

.court-info {
  position: relative;

  /* width: min(350px, 70%); */
  padding: 18px 25px;

  text-align: center;

  background: rgba(255, 255, 255, 0.96);
  border-radius: 22px;

  /* Viền dưới tạo cảm giác khối */
  border-bottom: 6px solid #983f00;

  /* Bóng */
  box-shadow:
    0 12px 20px rgba(0, 0, 0, 0.18),
    0 25px 50px rgba(0, 0, 0, 0.20);

  /* Hiệu ứng nổi */
  transform: translateY(0);

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease;

  overflow: hidden;
   margin-left: auto;
   margin-right: 7vw;
   width: fit-content;
}




/* Ánh sáng nhẹ phía trên card */

.court-info::before {
  content: "";

  position: absolute;
  top: 0;
  left: 10%;

  width: 80%;
  height: 2px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.9),
    transparent
  );
}


/* Hover */

.court-info:hover {
  transform: translateY(-8px);

  box-shadow:
    0 18px 30px rgba(0, 0, 0, 0.20),
    0 35px 65px rgba(0, 0, 0, 0.25);
}


/* Ngày */

.court-date {
  font-family: var(--mono);
  font-size: clamp(1.1rem, 2vw, 1.5rem);

  font-weight: 800;

  color: #3e1a00;

  letter-spacing: 0.08em;

  margin-bottom: 10px;
}


/* Tên sân */

.court-name {
  font-size: clamp(1.5rem, 4vw, 2rem);

  font-weight: 900;

  color: #983f00;

  line-height: 1;

  letter-spacing: -0.02em;

  margin-bottom: 10px;
}


/* Tên địa điểm */

.court-place {
  font-size: 0.8rem;

  font-weight: 700;

  color: #703000;

  text-transform: uppercase;

  letter-spacing: 0.25em;

  opacity: 0.75;
}



  /* ---------- Sections ---------- */
  section.block{
    padding:clamp(18px,4vw,44px) clamp(18px,6vw,64px);
    z-index:10; position:relative;
    }

     section{
    /* min-height: 50vw; */
    overflow-x: auto; 
    /* overflow-y: hidden; */
     scrollbar-width: none;
     height: fit-content;
  }

  section::-webkit-scrollbar {
    display: none; /* Chrome / Edge */
}


/* Section cho cái bảng hiệu số */
section.Bang-Dau-block {
  display: flex;
    justify-content: center;
    align-items: flex-start;
    column-gap: 100px;
    row-gap: 30px;
    flex-wrap: wrap;

}

section .grid-container{
   display: flex;
    justify-content: center;
    align-items: flex-start;
    column-gap: 50px;
    row-gap: 30px;
    flex-wrap: wrap;
}

section .sutBong-container {
  
  display: flex;
  justify-content: center;
  align-items: flex-end;
  overflow: visible;
  position: relative;
  width: 550px;
  height: 350px;
  /* top: 0px; */
}

section .sutBong-container dotlottie-wc {
  position: absolute;
  display: block;
  
  width: 600px;
  height: 400px;
}

@media (max-width: 1133px) {
 
 section .grid-container,   
section .sutBong-container {
    justify-content: left;
    
}

}


@media (max-width: 1200px) {
    section.Bang-Dau-block {
        justify-content: flex-start;
    }
}

section.schedule-block {
  display: flex;
    justify-content: center;
    align-items: flex-start;
    
    flex-wrap: wrap;

}

@media (max-width: 1200px) {
    section.schedule-block {
        justify-content: flex-start;
    }
}



 .seperate-block {
  border-top:1px solid var(--line);
  height: 0;
}



  .block h2{
    font-size:var(--fontSize2); 
    font-weight:700;
     margin:0 0 16px;}



  h3.table-name {
    font-size: var(--fontSize2);
    margin-bottom: 25px;
  }

  .rules-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; max-width:760px;}
  .rules-list li{
    display:flex; 
    gap:12px; 
    align-items:flex-start; 
    font-size: var(--fontSize3); 
    line-height:1.5;}
  .rules-list li .dot{width:9px;height:9px;background:var(--yellow); border-radius:2px; margin-top:7px; flex-shrink:0;}
  .rules-note{margin-top:14px; padding:10px 14px; border-left:3px solid var(--coral); font-size:.86rem; color:var(--chalk-dim); font-style:italic; max-width:760px;}


  /* đoạn participants */

  .participants-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:10px;
     align-items: start;
  }
.p-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: var(--fontSize4);

  min-height: clamp(45px, 4vw, 70px);
  height: auto;
  box-sizing: border-box;
}


  .groups-grid{
    display:grid; 
     grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap:16px;
    align-items: start;
  }
  .group-card{
    border:1px solid var(--line); border-radius:14px; overflow:hidden; background:rgba(243,246,236,.03);
  }


  .group-head{
    color: var(--text1);
    background:var(--teal-soft); 
    padding:10px 14px; 
    font-family:var(--mono);
     font-weight:700;
    font-size:var(--fontSize3); 
    letter-spacing:.02em;
     display: flex;
    align-items: center; 
    justify-content: center;
  }

  .slot-group{
    width:100%; background:transparent; border-top:1px solid var(--line-strong);
    padding: 15px 14px;
    color:var(--chalk); 
    font-size:var(--fontSize4);
     outline:none;
      height: clamp(45px, 4vw, 70px);
    box-sizing: border-box;
     display: flex;
    align-items: center; 
  }

 .slot-group:nth-child(-n + 3) {
  background: var(--winGroupStage);
}
  
  /* bảng bóng đá */

  
 

  .group-schedule{
    width:100%; min-width:900px; border-collapse:collapse;
    background:rgba(243,246,236,.06); font-size:.88rem;
  }
  .group-schedule th,
  .group-schedule td{
    border:1px solid var(--line); padding:8px 10px; text-align:center;
    font-size: var(--fontSize4);
  }
  .group-schedule thead th{background:var(--yellow); color:var(--text3); font-weight:700;}

 
/* Bảng hiệu số bóng đá  */

 

.Bang-dau {
  width: 100%;
  min-width: 590px;
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;

  background: rgba(255, 247, 237, .75);
  
  border-radius: 10px;

  font-size: .88rem;
  box-shadow: 0 3px 10px rgba(143, 63, 10, .08);
}

.Bang-dau thead tr:first-child  th {
  border-top: var(--theadBorder);
 
}

.Bang-dau thead tr:first-child  th:first-child {
  border-left: var(--theadBorder);
   border-top-left-radius: var(--tableBorderRadius);
}

.Bang-dau thead tr:first-child  th:last-child {
  border-right: var(--theadBorder);
  border-top-right-radius: var(--tableBorderRadius);
}


.Bang-dau tbody tr td:first-child {

  border-left: var(--tbodyBorder);
 
}

.Bang-dau tbody tr td:last-child {

  border-right:  var(--tbodyBorder);
 
}

.Bang-dau tbody tr:last-child td{

  border-bottom:  var(--tbodyBorder);
 
}

.Bang-dau tbody tr:last-child td:first-child{

   border-bottom-left-radius: var(--tableBorderRadius);
 
}

.Bang-dau tbody tr:last-child td:last-child{

    border-bottom-right-radius: var(--tableBorderRadius);
 
}


.Bang-dau th,
.Bang-dau td {
  border: 0;
  border-right: 1px solid rgba(143, 63, 10, .20);
  border-bottom: 1px solid rgba(143, 63, 10, .20);

  padding: 8px 10px;
  text-align: center;
  font-size: var(--fontSize4);
}



.Bang-dau td:first-child {
  
  padding-left: 20px;
}

.Bang-dau td:nth-child(6) {
  text-align: left;
}

.Bang-dau th:first-child{
  width: 120px;
}

.Bang-dau thead tr:first-child th:nth-child(2),
.Bang-dau thead tr:first-child th:nth-child(4),
.Bang-dau th:last-child,
.Bang-dau thead tr:nth-child(2) th {
  width: 80px;
}

/* Header */
.Bang-dau thead th {
  background: #F6C76A;
  color: #6F2F08;
  font-weight: 700;

  border-right: 1px solid #B85A16;
  border-bottom: 1px solid #B85A16;

  padding: 8px 10px;
  text-align: center;
}

/* Cột cuối cùng không cần đường dọc bên phải */


/* Dòng xen kẽ */
.Bang-dau tbody tr:nth-child(even) {
  background:  var(--soleColor1);
}

.Bang-dau tbody tr:nth-child(odd) {
  background:  var(--soleColor2);
}

/* khi xác định được đội vào trong  */

.Bang-dau:not(.vua-pha-luoi) tbody tr:nth-child(-n+2) {
  background: var(--winGroupStage);
}

.Bang-dau tbody tr:nth-child(2) {
  background: var(--winGroupStage);
} */



/* Bỏ border ngoài cùng */


  
/* Icon bong da */
.football-icon{
  height: min(140px,14vw);
  overflow: visible;
}

.football-bouncing{
  transform-box: fill-box;
  transform-origin: center center;
  
  /* animation: football-roll 3.2s ease-in-out infinite alternate; */
}

@media (max-width: 700px){
  .groups-grid{
    grid-template-columns: minmax(0, 280px);
  }
}

  /* ---------- Bracket ---------- */
  .bracket-scroll{ padding-bottom:10px;}
  .bracket-rounds{display:flex; align-items:stretch; gap:clamp(10px,2vw,22px); min-width:max-content; padding:6px 2px 20px;}
  .round-col{display:flex; flex-direction:column; justify-content:space-around; gap:18px; min-width:198px;}

  .round-title{
    text-align:center; 
    font-family:var(--font-serif); 
    font-size:1.8rem; 
    color:var(--text3); }

  .round-title.hang-doc {
    text-align:left; 
        text-align: left;
    display: flex;
    align-items: center;
  }

        /* Các cánh cửa trượt ngang */
        .door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            pointer-events: auto; /* Chặn click xuyên qua cửa khi đang đóng */
        }

        .door-left {
            /* Clip path zig-zag cho nửa bên trái */
            clip-path: polygon(
                0% 0%, 50% 0%, 
                calc(50% - 40px) 10%, calc(50% + 40px) 20%, 
                calc(50% - 40px) 30%, calc(50% + 40px) 40%, 
                calc(50% - 40px) 50%, calc(50% + 40px) 60%, 
                calc(50% - 40px) 70%, calc(50% + 40px) 80%, 
                calc(50% - 40px) 90%, 50% 100%, 
                0% 100%
            );
            background: linear-gradient(135deg, #f7931e 0%, #c1272d 100%);
            /* Thêm bóng để tách biệt hai cánh cửa khi xếp chồng lên nhau */
            filter: drop-shadow(5px 0 15px rgba(0,0,0,0.7));
            z-index: 11; /* Đặt cao hơn cửa phải 1 chút để bóng đè lên */
        }

        .door-left::after {
          content: "";
          position: absolute;
           left: 0;
          top: 0;

          width: 100%;
          height: 100%;

          background-image: url("./img/Door.png");
          background-size: cover;
          background-position: left;

          opacity: 0.2;

          pointer-events: none;
      }

        .door-right {
            /* Clip path zig-zag khớp vừa khít cho nửa bên phải */
            clip-path: polygon(
                100% 0%, 50% 0%, 
                calc(50% - 40px) 10%, calc(50% + 40px) 20%, 
                calc(50% - 40px) 30%, calc(50% + 40px) 40%, 
                calc(50% - 40px) 50%, calc(50% + 40px) 60%, 
                calc(50% - 40px) 70%, calc(50% + 40px) 80%, 
                calc(50% - 40px) 90%, 50% 100%, 
                100% 100%
            );
            background: linear-gradient(135deg, #f7931e 0%, #9e1f24 100%);
            z-index: 10;
        }

         .door-right::after {
          content: "";
          position: absolute;
          right:0;

           top: 0;

          width: 100%;
          height: 100%;
          
          background-image: url("./img/Door.png");
          background-size: cover;
          background-position: right;

          opacity: 0.2;

          /* pointer-events: none; */
      }

        /* Trạng thái mở cửa */
        .door-left.open {
            transform: translateX(-100vw);
        }

        .door-right.open {
            transform: translateX(100vw);
        }

        /* Lớp giao diện chứa nút bấm ban đầu */
        .ui-layer {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .ui-layer.hidden-ui {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        /* Hiệu ứng trôi nổi */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

            animation: float 3s ease-in-out infinite;

function createTable(tableData, className = '',id=null) {

  const renderRows = (rows) => {
    return rows.map(row => {

      const type = row.th ? 'th' : 'td';
      const cells = row[type];

      return `<tr>
        ${cells.map(cell => {

          // Cell dạng string
          if (typeof cell === 'string') {
            return `<${type}>${esc(cell)}</${type}>`;
          }

          // Các attribute của cell
          const attrs = [
            cell.rowspan ? `rowspan="${cell.rowspan}"` : '',
            cell.colspan ? `colspan="${cell.colspan}"` : ''
          ].filter(Boolean).join(' ');

          return `<${type}${attrs ? ' ' + attrs : ''}>
            ${cell.v ?? ''}
          </${type}>`;

        }).join('')}
      </tr>`;

    }).join('');
  };


  return `
    <table class="${className}" ${id ? `id="${id}"` : ''}>

      <thead>
        ${renderRows(tableData.thead)}
      </thead>

      <tbody>
        ${renderRows(tableData.tbody)}
      </tbody>

    </table>
  `;
}

  },

)

tab.dataset.hienChamp = 'false';

// đoạn dưới cho image slider 

document.addEventListener('DOMContentLoaded', () => {
    const sliders = document.querySelectorAll('.image-slider');
    if (!sliders.length) return;

    sliders.forEach(slider => {
        const images = slider.querySelectorAll('img');
        const prevBtn = slider.querySelector('.slider-prev');
        const nextBtn = slider.querySelector('.slider-next');

        if (!images.length || !prevBtn || !nextBtn) return;

        let currentIndex = 0;
        let autoSlide;

        // Khởi tạo
        gsap.set(images, {
            xPercent: 0,
            opacity: 0
        });

        gsap.set(images[0], {
            xPercent: 0,
            opacity: 1
        });

        // Chuyển ảnh
        function showSlide(newIndex, direction = 1) {
            if (newIndex >= images.length) newIndex = 0;
            if (newIndex < 0) newIndex = images.length - 1;
            if (newIndex === currentIndex) return;

            const currentImage = images[currentIndex];
            const nextImage = images[newIndex];

            gsap.killTweensOf([currentImage, nextImage]);
            
            const tl = gsap.timeline();

            tl.set(nextImage, {
                xPercent: direction > 0 ? 100 : -100,
                opacity: 1
            })
            .to(currentImage, {
                xPercent: direction > 0 ? -100 : 100,
                duration: 0.8,
                ease: 'power2.inOut'
            })
            .to(nextImage, {
                xPercent: 0,
                duration: 0.8,
                ease: 'power2.inOut'
            },"<");

            currentIndex = newIndex;
        }

        // Next
        function nextSlide() {
            showSlide(currentIndex + 1, 1);
            resetAutoSlide();
        }

        // Previous
        function prevSlide() {
            showSlide(currentIndex - 1, -1);
            resetAutoSlide();
        }

        // Tự chuyển ảnh sau 5 giây
        function resetAutoSlide() {
            clearTimeout(autoSlide);

            autoSlide = setTimeout(() => {
                showSlide(currentIndex + 1, 1);
                resetAutoSlide();
            }, 5000);
        }

        // Button
        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        // Start
        resetAutoSlide();
    });
});

            document.getElementById('door-left').classList.remove('open');
            document.getElementById('door-right').classList.remove('open');
           
       
            setTimeout(() => {
           
                document.getElementById('ui-layer').classList.remove('hidden-ui');
                const viewport = document.querySelector('.viewport');

        }


        // tạo scroll bar
       document.addEventListener("DOMContentLoaded", () => {

    gsap.registerPlugin(Draggable);

    const myScrollBars =
        document.querySelectorAll('.my-scroll-bar');

        

    myScrollBars.forEach(bar => {
      

        const dragIcon = bar.querySelector(':scope > *');
         
        const targetId = bar.dataset.scroll;
        
        const target = document.getElementById(targetId);

    


        if (!dragIcon || !target) return;

        // console.log(target);


        // =========================
        // DRAGGABLE
        // =========================
      
       
        const draggable = Draggable.create(dragIcon, {

            type: "x",

            bounds: bar,

            onDrag() {
      

                updateScroll(this);

                
            },

            onDragEnd(){
              // console.log(draggable.x)
       
            }

        })[0];


       

        // =========================
        // UPDATE SCROLL
        // =========================

        function updateScroll(drag) {

            const barWidth =
                bar.getBoundingClientRect().width;

            const iconWidth =
                dragIcon.getBoundingClientRect().width;

            const maxDragX =
                barWidth - iconWidth;

            const progress =
                drag.x / maxDragX
            
                

            const maxScrollX =
                target.scrollWidth - target.clientWidth;

            target.scrollLeft =
                progress * maxScrollX;

           
        }

        // khi scroll trên điện thoại
        target.addEventListener("scroll", () => {

            const maxScrollX =
                target.scrollWidth - target.clientWidth;

            if (maxScrollX <= 0) return;

            progress =
                target.scrollLeft / maxScrollX;

            const maxDragX =
                bar.getBoundingClientRect().width -
                dragIcon.getBoundingClientRect().width;

            gsap.set(dragIcon, {
                x: progress * maxDragX
            });

        });

        // =========================
        // RESIZE
        // =========================

      const resizeObserver = new ResizeObserver(() => {

          
          const maxDragX =
              bar.getBoundingClientRect().width - dragIcon.getBoundingClientRect().width;

            const progress =
                draggable.x / maxDragX


          draggable.applyBounds();

          
          

          // // Dùng progress đã lưu
          // gsap.set(dragIcon, {
          //     x: progress * maxDragX
          // });

          // Cập nhật lại scroll theo kích thước mới
          const maxScrollX =
              target.scrollWidth - target.clientWidth;

            //   console.log({
            //     progress: progress,
            //     barClientWidth: bar.clientWidth,
            //     barWidth: bar.getBoundingClientRect().width,
            //     iconOffsetWidth: dragIcon.offsetWidth,
            //     iconWidth: dragIcon.getBoundingClientRect().width,
            //     maxDragX,
            //     progress,
            //     targetScrollLeft: target.scrollLeft,
            //     targetScrollWidth: target.scrollWidth,
            //     targetClientWidth: target.clientWidth,
            //     maxScrollX,
            //     targetId
            // });
          target.scrollLeft =
              progress * maxScrollX;

      });



        resizeObserver.observe(bar);

    });

});
        // TÍnh toán hiện scrollbar khi resize phù hợp
      function updateBangDauScrollBars() {
    document
        .querySelectorAll('section')
        .forEach(section => {

            const firstTable = section.querySelector('table');

            if (!firstTable) return;

            const scrollBar = document.querySelector(
                `.my-scroll-bar[data-scroll="${section.id}"]`
            );

            if (!scrollBar) return;

            // Panel cha gần nhất
            const panel = section.closest('.panel');

            if (!panel) {
                scrollBar.style.display = 'none';
                return;
            }

            const panelRect = panel.getBoundingClientRect();

            // Panel có nằm trong viewport không?
            const panelInViewport =
                panelRect.right > 0 &&
                panelRect.left < window.innerWidth &&
                panelRect.bottom > 0 &&
                panelRect.top < window.innerHeight;

            // Nếu panel không hiện trên viewport -> ẩn scrollbar
            if (!panelInViewport) {
                scrollBar.style.display = 'none';
                return;
            }

            // Sau khi panel đã nằm trong viewport,
            // mới kiểm tra bảng có bị tràn ngang không
            const rect = firstTable.getBoundingClientRect();

            const isHidden =
                rect.left < 0 ||
                rect.right > window.innerWidth;

            scrollBar.style.display =
                isHidden ? 'flex' : 'none';
        });
        
}
window.addEventListener('resize', updateBangDauScrollBars);
window.addEventListener('load', updateBangDauScrollBars);


        

    </script>
