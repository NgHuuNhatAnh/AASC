<style>
  :root{
    --text1:white;
    --text3:black;
   --fontSize4:clamp(.95rem, 1vw, 1.1rem);
   --fontSize3:clamp(1.1rem, 1vw, 1.3rem);
   --fontSize2:clamp(1.3rem, 1vw, 2rem);
    --font-serif: 'Noto Serif', serif;

  --navy:#8F3F0A;
--teal:#D65F0A;

  --navy-deep:linear-gradient(
            135deg,
            #ffffff 0%,
            #ffffff 60%,
            #fff7ed 78%,
            #ffd6a3 100%
        );;

  
  --teal-soft:#A84E13;

  --chalk:black;

  --chalk-dim:rgba(255,243,226,.62);

  --yellow:#FFCC66;

  --coral:#FF7A3D;

  --line:black;

  --line-strong:black;

  --topbar-h: 100px;

  --mono:'Space Mono',ui-monospace,monospace;

  --sans:'Be Vietnam Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--navy-deep);
    color:var(--chalk);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  input{font-family:inherit;}
  ::selection{background:var(--yellow);color:var(--navy-deep);}
 
/*----- cái hình background ----------- */
  .image-background{
    position:absolute; 
    top: 200px;
    right:5px;
    width:300px; 
    height:300px; 
    object-fit:cover; 
    object-position:center;
    z-index:0;
      /* flex-shrink: 0; */

  }
  /* ---------- Court-line texture ---------- */
  .court-bg{
    background-image:
      linear-gradient(180deg,var(--teal) 0%,var(--navy) 62%);
    position:relative;
  }
  .court-bg::after{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(243,246,236,.05) 0 1px, transparent 1px 64px);
    pointer-events:none;
  }

  /* ---------- Topbar ---------- */
 .topbar {
    min-height: var(--topbar-h);
    height: auto;

    display: flex;
    align-items: center;
    flex-wrap: wrap;

    gap: 10px;
    padding: 10px clamp(10px, 3vw, 24px);

    background: var(--navy);
    border-bottom: 1px solid var(--line);

    position: relative;
    z-index: 50;
}
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;

    flex: 0 0 auto;
    white-space: nowrap;
}

.tabs {
    flex: 1 1 auto;

    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    overflow: visible;
}

.tab {
    flex: 0 0 auto;       /* KHÔNG cho tab co lại */

    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: white;

    padding: 16px 20px;
    border-radius: 999px;

    font-weight: 600;
    font-size: var(--fontSize4);

    white-space: nowrap;
    cursor: pointer;

    font-family: var(--sans);
}
 
  .brand-text{font-weight:800; 
    font-size:var(--fontSize3); 
    letter-spacing:.01em;color: white;}

  .brand-text small{display:block; font-weight:500; font-size:var(--fontSize4); color:var(--chalk-dim); font-family:var(--mono);}

  
  .tabs::-webkit-scrollbar{display:none;}
  
 
  .tab:hover{border-color:var(--line-strong);}
  .tab:active{transform:scale(.97);}
  .tab.active{
    background:var(--yellow); color:black; border-color:var(--yellow);}


  /* ---------- Slide track ---------- */
  .viewport{
    height:calc(100dvh - var(--topbar-h));
    overflow-x: hidden;
    overflow-y: auto;
    position:relative;
  }
  .track{
    display:flex; 
    height:auto;

  min-height: 100%;
}
  .panel{
    flex:0 0 100vw; 
    width:100vw; 
    height:auto;
     overflow-y: auto;
     overflow-x: hidden ;
  }
  
  .tournament-block{
    /* min-height: 50vw; */
    overflow-x: auto;
    /* overflow-y: auto; */
  }

  /* ---------- Hero ---------- */
  .hero{
    padding:clamp(28px,6vw,56px) clamp(18px,6vw,64px) clamp(22px,4vw,32px);
    border-bottom:4px solid var(--yellow);
    display:flex; justify-content:flex-start; 
    align-items:center; gap:20px; flex-wrap:wrap;
  }
  .hero-title{font-size:clamp(2.1rem,7vw,3.6rem); font-weight:800; margin:0; line-height:1.02;
  color:var(--text1)}
  .hero-sub{margin:10px 0 0; font-family:var(--mono); font-size:.82rem; color:var(--chalk-dim); letter-spacing:.01em;}
  .hero-icon {
    width: min(250px, 20vw);
    height: min(250px, 20vw);
    flex-shrink: 0;
    opacity: 1;
}

  /* ---------- Sections ---------- */
  section.block{
    padding:clamp(18px,4vw,44px) clamp(18px,6vw,64px);
    z-index:10; position:relative;
    }
  section.block + section.block{border-top:1px solid var(--line);}
  .block h2{
    font-size:var(--fontSize2); 
    font-weight:700;
     margin:0 0 16px;}

  .rules-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; max-width:760px;}
  .rules-list li{
    display:flex; 
    gap:12px; 
    align-items:flex-start; 
    font-size: var(--fontSize3); 
    line-height:1.5;}
  .rules-list li .dot{width:9px;height:9px;background:var(--yellow); border-radius:2px; margin-top:7px; flex-shrink:0;}
  .rules-note{margin-top:14px; padding:10px 14px; border-left:3px solid var(--coral); font-size:.86rem; color:var(--chalk-dim); font-style:italic; max-width:760px;}


  /* đoạn participants */

  .participants-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:10px;
     align-items: start;
  }
.p-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: var(--fontSize4);

  min-height: clamp(45px, 4vw, 70px);
  height: auto;
  box-sizing: border-box;
}


  .groups-grid{
    display:grid; 
     grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap:16px;
    align-items: start;
  }
  .group-card{
    border:1px solid var(--line); border-radius:14px; overflow:hidden; background:rgba(243,246,236,.03);
  }

  .group-head{
    color: var(--text1);
    background:var(--teal-soft); 
    padding:10px 14px; 
    font-family:var(--mono);
     font-weight:700;
    font-size:var(--fontSize3); 
    letter-spacing:.02em;
     display: flex;
    align-items: center; 
    justify-content: center;
  }

  .slot-group{
    width:100%; background:transparent; border-top:1px solid var(--line-strong);
    padding: 15px 14px;
    color:var(--chalk); 
    font-size:var(--fontSize4);
     outline:none;
      height: clamp(45px, 4vw, 70px);
    box-sizing: border-box;
     display: flex;
    align-items: center; 
  }
  

  /* ---------- Bracket ---------- */
  .bracket-scroll{ padding-bottom:10px;}
  .bracket-rounds{display:flex; align-items:stretch; gap:clamp(10px,2vw,22px); min-width:max-content; padding:6px 2px 20px;}
  .round-col{display:flex; flex-direction:column; justify-content:space-around; gap:18px; min-width:198px;}

  .round-title{
    text-align:center; 
    font-family:var(--font-serif); 
    font-size:1.8rem; 
    color:var(--text3); }

  .round-arrow{display:flex; align-items:center; justify-content:center; color:var(--line-strong); font-size:1.6rem; align-self:center; padding-top:22px;}
  .match{
    background:rgba(243,246,236,.045); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; display:flex; flex-direction:column; gap:6px;
  }
  .team-row{display:flex; align-items:center; gap:8px; font-size:.88rem;}
  .team-label{padding:5px 2px; flex:1;}
  .team-input{
    flex:1; background:transparent; border:1px dashed var(--line-strong); border-radius:6px;
    padding:6px 8px; color:var(--chalk); font-size:.85rem; outline:none; min-width:0;
  }
  .team-input:focus{border-color:var(--yellow); background:rgba(228,255,77,.06);}
  .score-row{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.76rem; color:var(--chalk-dim); margin-top:2px;}
  .score-input{
    width:64px; background:transparent; border:1px dashed var(--line-strong); border-radius:6px;
    padding:5px 6px; color:var(--yellow); text-align:center; font-family:var(--mono); font-size:.82rem; outline:none;
  }
  .score-input:focus{border-color:var(--yellow);}
  .champ-container{display:flex; align-items:center;}
  .champ-card{
    background:linear-gradient(135deg,var(--yellow),#FFF7B0); color:var(--navy-deep);
    border-radius:16px; padding:16px 20px; display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:.92rem; min-width:220px;
  }
  .champ-card input{
    flex:1; background:rgba(8,28,36,.08); border:1px dashed rgba(8,28,36,.35); border-radius:8px;
    padding:7px 9px; color:var(--navy-deep); font-weight:700; font-size:.88rem; outline:none; min-width:0;
  }
  .champ-card input:focus{border-color:var(--navy-deep);}

  footer.pad{height:24px;}

  /* CSS thêm */
 .logo-wrap {
    height: clamp(50px, 5vw, 70px);

    min-width: 100px;

    overflow: hidden;
    border-radius: 34px;
    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    flex: 0 0 auto;
}

.logo {
    height: 150%;
    width: auto;
    display: block;
}

/* cái tournament bracket  */
.tourament-bracket {
    display: flex;
    /* gap: 100px; */
    align-items: flex-start;
        position: relative;
}



.bracket-match {
    display: grid;
    grid-template-columns: 1fr 45px;
    grid-template-rows: 1fr 1fr;

    box-sizing: border-box;

    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
}

.connector-1{
     
     border-top:1px red solid;
    border-right:1px red solid;
}

.connector-2{
     border-right:1px red solid;
      border-bottom:1px red solid;
}

.connector-line{
    border-top:1px red solid;
}

/* đội trong bảng */
.bracket-match > div {
    display: contents;
}

.bracket-match span {
    display: flex;
    align-items: center;
    padding-left: 12px;
}

.bracket-match span:nth-child(even) {
    justify-content: center;
    padding-left: 0;

    border-left: 1px solid #333;
}

.bracket-match .team-row:nth-child(2) span {
    border-top: 1px solid #333;
}


/* slider  */
#image-slider {
     position: relative;

    width: 100%;
    height: 700px !important;

    overflow: hidden;

    background: red;

    z-index: 9999;
}

/* Tất cả ảnh nằm chồng lên nhau */
#image-slider img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 40%;
    opacity: 0;
}

/* Ảnh đầu tiên */
#image-slider img:first-of-type {
    opacity: 1;
}

/* Nút */
.slider-btn {
    position: absolute;

    top: 50%;
    z-index: 10;

    transform: translateY(-50%);

    width: 50px;
    height: 80px;

    border: none;
    border-radius: 10px;

    background: rgba(0, 0, 0, 0.35);
    color: white;

    font-size: 50px;
    line-height: 1;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: background 0.2s;
}

.slider-btn:hover {
    background: rgba(0, 0, 0, 0.6);
}

.slider-prev {
    left: 20px;
}

.slider-next {
    right: 20px;
}

/* cho icon vot bong pickle ball  */
.vot-bong-pickleball{
  height: min(200px,20vw);
}

</style>
</head>

/* ============ helpers ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ============ build interactive panels ============ */
const tabsEl = document.getElementById('tabs');
const trackEl = document.getElementById('track');

TOURNAMENTS.forEach((cat, idx)=>{
  // tab
  const tab = document.createElement('button');
  tab.className = 'tab'+(idx===0?' active':'');
  tab.textContent = cat.tab;
  tab.setAttribute('data-index', idx);
  tab.addEventListener('click', ()=>goTo(idx));
  tabsEl.appendChild(tab);

  // panel
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = buildPanelHTML(cat);
  trackEl.appendChild(panel);
});

function buildPanelHTML(cat){
  const rulesHTML = cat.rules.map(r=>`<li><span>${esc(r)}</span></li>`).join('');
  const noteHTML = cat.note ? `<div class="rules-note">${esc(cat.note)}</div>` : '';
  
  const participantsHTML = cat.participants.map(p=>`<div class="p-chip"><span class="ball">🏓</span>${esc(p[0])}</div>`).join('');
  
     const groupsHTML = cat.groups.map(g=>{

      const playersInGroup = cat.participants.filter(
          p => p[1] === g.name
        );

    const slots = Array.from({length:g.size}).map((_,i)=>{
      const id = `slot__${cat.id}__${g.name}__${i}`;

      const player = playersInGroup[i];

    // Nếu có người thì lấy tên, không có thì để trống
    const playerName = player
      ? player[0]
      : '';

      return `  <div class="slot-group" id="${id}">
        👥 ${esc(playerName)}
      </div>`;
    }).join('');
    return `<div class="group-card"><div class="group-head">Bảng ${esc(g.name)}</div>${slots}</div>`;
  }).join('');

  


const roundsHTML = createTournamentBracket(cat.rounds);


  

  return `
    <div class="court-bg hero">
      <div>
        <h1 class="hero-title">${esc(cat.title)}</h1>
        <p class="hero-sub">${esc(cat.subtitle)}</p>
      </div>
      <div class="hero-icon">${HERO_ICON}</div>
    </div>

    <section class="block">
      <h2>📋 Thể thức thi đấu</h2>
      <ul class="rules-list">${rulesHTML}</ul>
      ${noteHTML}
    </section>

    <section class="block">
      <h2>Danh sách vận động viên</h2>
      <div class="participants-grid">${participantsHTML}</div>
    </section>

    <section class="block">
      <h2>Bảng đấu vòng tròn</h2>
      <div class="groups-grid">${groupsHTML}</div>
    </section>

    <section class="block tournament-block">
      <h2>Sơ đồ vòng loại trực tiếp</h2>

      style="height: ${roundsHTML[1]}px;
      width: ${roundsHTML[2]}px;">

        </div>
    </section>
    
  `;
}

function createTournamentBracket(arrayParticipants) {

    
    let heigtOfContainer = 0;
    let widthOfContainer = 0;
    let numberOfMatches = 4;
     numberOfMatches = arrayParticipants.matches[0].participants.length/2;

    //  console.log('number of matches: ',numberOfMatches)
    let participants = arrayParticipants.matches[0].participants;
    let stt = 0;

    const gapRows = 15;
    const gapColumns = 70;
    const connectorConnerRadius = 10;
    const boxTeamHeight = 80;   
    const boxTeamWidth = 220;  

    const roundTitleHeight = 40;
    const marginBotRoundTitle = 20;
    // const bracket = document.getElementById('tourament-bracket');

    // Kiểm tra số đội có phải lũy thừa của 2
    if (
        numberOfMatches <= 0 ||
        Math.log2(numberOfMatches) % 1 !== 0
    ) {
        throw new Error(
            'Số đội phải là lũy thừa của 2'
        );
    }
    // Xóa bracket cũ nếu có
    let bracketHTML = '';

    // Tổng số round
    const totalRounds = Math.log2(numberOfMatches)+1;

    // Khoảng cách hiện tại giữa các box
    let currentGapRows = gapRows;
  
    // Số box của round hiện tại
    let currentNumberOfMatches = numberOfMatches;
    let translateYvalue= 0;
    let currentRoundTop=roundTitleHeight + marginBotRoundTitle;;
    let oldgapRows=0;


    // Vòng lặp từng round (nhưng để tạo match, k cần tạo round)
    for (
        let roundIndex = 0;
        roundIndex < totalRounds;
        roundIndex++
    ) {

        for (
            let matchIndex = 0;
            matchIndex < currentNumberOfMatches;
            matchIndex++
        ) {

           const matchLeft = (boxTeamWidth + gapColumns) * roundIndex;

          if (matchIndex ==0) {
              bracketHTML += `<div class="round-title"
              style="
              position: absolute;
              height: ${roundTitleHeight}px;
              width:${boxTeamWidth}px;
             transform: translateX(${matchLeft}px);
              margin-bottom:${marginBotRoundTitle}px;">
              ${arrayParticipants.matches[roundIndex].name}
              </div>`;
              
          }

           

            // match.style.transform = `translate(${matchLeft}px,${translateYvalue}px)`;

            bracketHTML += `<div class="bracket-match" style="
            position : absolute;
            top: ${currentRoundTop}px;
            height: ${boxTeamHeight}px;
            width : ${boxTeamWidth}px;
            transform: translate(${matchLeft}px,${translateYvalue}px)">
            <div class="team-row">
              <span>${participants[stt]?.[0] ?? '-'}</span><span>${participants[stt]?.[1] ?? '-'}</span>
            </div>
            <div class="team-row">
              <span>${participants[stt+1]?.[0] ?? '-'}</span><span>${participants[stt+1]?.[1] ?? '-'}</span>
            </div>
            </div>`;

            stt += 2;

            if (roundIndex!= 0){

            // const rect = match.getBoundingClientRect();

            // const currentMatchLeft = rect.left;
            const middlteOfMatch = currentRoundTop + translateYvalue + boxTeamHeight/2;

            bracketHTML += `<div class="connector-1" style="
            position : absolute;
            top: ${middlteOfMatch}px;
            left: ${(matchLeft - gapColumns)}px;
            height: ${(oldgapRows+ boxTeamHeight)/2}px;
            width : ${gapColumns/2}px;
            border-top-right-radius: ${connectorConnerRadius}px;
            transform: translateY(-100%)"></div>

            <div class="connector-2" style="
            position : absolute;
            top: ${middlteOfMatch}px;
            left: ${(matchLeft  - gapColumns)}px;
            height: ${(oldgapRows+ boxTeamHeight)/2}px;
            width : ${gapColumns/2}px;
            border-bottom-right-radius: ${connectorConnerRadius}px;">
            </div>

            <div class="connector-line" style="
            position : absolute;
            top: ${middlteOfMatch}px;
            left: ${matchLeft - gapColumns/2}px;
            height: 0px;
            width : ${gapColumns/2}px;"></div>`

            }

            if (matchIndex < currentNumberOfMatches - 1) {
                translateYvalue = (currentGapRows + boxTeamHeight) * (matchIndex + 1);
                // console.log(translateYvalue)
            } else {

                 if (roundIndex == 0) {
                  heigtOfContainer = currentRoundTop + translateYvalue + boxTeamHeight;
                } 

                 if (roundIndex == totalRounds-1) {
                   widthOfContainer = matchLeft + boxTeamWidth*2 + gapColumns ;

                   bracketHTML += 
                   `<div class="champ-container" style="
                   position: absolute;
                    top: ${currentRoundTop}px;
                    height: ${boxTeamHeight}px;
                    width : ${boxTeamWidth}px;
                    transform: translate(${matchLeft+gapColumns+boxTeamWidth}px,${translateYvalue}px)"><div class="champ-card">🏆 <span>Vô địch</span>
                    </div></div>`;
                  
                } 
               

                oldgapRows = currentGapRows;
                currentRoundTop += currentGapRows / 2 + boxTeamHeight / 2;
                translateYvalue = 0;
                currentGapRows = currentGapRows * 2 + boxTeamHeight;
               
            }

            

        }

         
        // Round tiếp theo giảm một nửa số match
        currentNumberOfMatches /= 2;
    }
return [bracketHTML, heigtOfContainer, widthOfContainer];

}



/* ============ GSAP slide navigation ============ */
let current = 0;
function goTo(index){
  if(index===current) return;
  current = index;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', i===index));
  gsap.to(trackEl, {x:`-${index*100}vw`, duration:.65, ease:'power3.inOut'});
}
window.addEventListener('resize', ()=>{ gsap.set(trackEl, {x:`-${current*100}vw`}); });

// swipe support
let touchStartX = null;
const viewportEl = document.querySelector('.viewport');
viewportEl.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
viewportEl.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0 && current < TOURNAMENTS.length-1) goTo(current+1);
    else if(dx > 0 && current > 0) goTo(current-1);
  }
  touchStartX = null;
});
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' && current < TOURNAMENTS.length-1) goTo(current+1);
  if(e.key==='ArrowLeft' && current > 0) goTo(current-1);
});

// đoạn dưới cho slider 
document.addEventListener('DOMContentLoaded', () => {

    const slider = document.querySelector('#image-slider');

    if (!slider) return;

    const images = slider.querySelectorAll('img');

    const prevBtn = slider.querySelector('#slider-prev');
    const nextBtn = slider.querySelector('#slider-next');

    let currentIndex = 0;
    let autoSlide;


    // =========================
    // Khởi tạo
    // =========================

    gsap.set(images, {
        xPercent: 0,
        opacity: 0
    });

    gsap.set(images[0], {
        xPercent: 0,
        opacity: 1
    });


    // =========================
    // Chuyển ảnh
    // =========================

    function showSlide(newIndex, direction = 1) {

        // vòng lại
        if (newIndex >= images.length) {
            newIndex = 0;
        }

        if (newIndex < 0) {
            newIndex = images.length - 1;
        }

        if (newIndex === currentIndex) return;


        const currentImage = images[currentIndex];
        const nextImage = images[newIndex];


        // Dừng animation đang chạy nếu người dùng bấm liên tục
        gsap.killTweensOf([currentImage, nextImage]);


        // Ảnh mới nằm ngoài màn hình
        gsap.set(nextImage, {
            xPercent: direction > 0 ? 100 : -100,
            opacity: 1
        });


        // Ảnh hiện tại trượt ra
        gsap.to(currentImage, {
            xPercent: direction > 0 ? -100 : 100,
            duration: 0.8,
            ease: "power2.inOut"
        });


        // Ảnh mới trượt vào
        gsap.to(nextImage, {
            xPercent: 0,
            duration: 0.8,
            ease: "power2.inOut"
        });


        currentIndex = newIndex;
    }


    // =========================
    // Next
    // =========================

    function nextSlide() {

        showSlide(currentIndex + 1, 1);

        resetAutoSlide();
    }


    // =========================
    // Previous
    // =========================

    function prevSlide() {

        showSlide(currentIndex - 1, -1);

        resetAutoSlide();
    }


    // =========================
    // Auto 5 giây
    // =========================

    function resetAutoSlide() {

        clearTimeout(autoSlide);

        autoSlide = setTimeout(() => {

            showSlide(currentIndex + 1, 1);

            resetAutoSlide();

        }, 5000);
    }


    // =========================
    // Button
    // =========================

    nextBtn.addEventListener('click', nextSlide);

    prevBtn.addEventListener('click', prevSlide);


    // =========================
    // Start
    // =========================

    resetAutoSlide();

});
